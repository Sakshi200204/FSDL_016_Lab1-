<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced UI Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-wrapper">
    <form class="form-card" id="contactForm" novalidate>

      <h2>Contact Us</h2>
      <p class="subtitle">Modern UI • Advanced JS</p>

      <div class="input-group">
        <input type="text" id="name" required>
        <label>Name</label>
      </div>

      <div class="input-group">
        <input type="email" id="email" required>
        <label>Email</label>
      </div>

      <div class="input-group">
        <input type="tel" id="phone" required>
        <label>Phone</label>
      </div>

      <div class="input-group">
        <select id="subject" required>
          <option value="">Select Subject</option>
          <option value="support">Support</option>
          <option value="sales">Sales</option>
          <option value="feedback">Feedback</option>
        </select>
      </div>

      <div class="input-group">
        <textarea id="message" rows="4" maxlength="500" required></textarea>
        <label>Message</label>
        <small id="charCount">0 / 500</small>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terms">
        <label for="terms">I agree to the terms</label>
      </div>

      <button type="submit" id="submitBtn" disabled>Send</button>
      <button type="reset" id="resetBtn">Reset</button>

      <span id="status"></span>
    </form>
  </div>

  <script src="form.js"></script>
</body>
</html>
